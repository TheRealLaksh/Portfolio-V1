<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="168" viewBox="0 0 1280 168" role="img">
<defs></defs>
<style>@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}@keyframes under{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}.c0{animation:pop .7s cubic-bezier(.22,1,.36,1) 0.15s both}.u0{transform-box:fill-box;transform-origin:left;animation:under .8s ease-out 0.5s both}.c1{animation:pop .7s cubic-bezier(.22,1,.36,1) 0.29000000000000004s both}.u1{transform-box:fill-box;transform-origin:left;animation:under .8s ease-out 0.64s both}.c2{animation:pop .7s cubic-bezier(.22,1,.36,1) 0.43000000000000005s both}.u2{transform-box:fill-box;transform-origin:left;animation:under .8s ease-out 0.78s both}.c3{animation:pop .7s cubic-bezier(.22,1,.36,1) 0.5700000000000001s both}.u3{transform-box:fill-box;transform-origin:left;animation:under .8s ease-out 0.92s both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
