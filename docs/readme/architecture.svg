<circle r="5" fill="#FF8A1F"><animateMotion dur="3.8s" repeatCount="indefinite" path="M336 270 C 410 270, 420 386, 480 386"/></circle>
<text x="392" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#565A7A" text-anchor="middle">POST /api/chat</text>
<path id="e5" d="M780 386 L900 386" fill="none" stroke="#FFC93C" stroke-opacity=".5" stroke-width="2" stroke-dasharray="8 8" style="animation:flow 1.6s linear infinite"/>
<circle r="5" fill="#FFC93C"><animateMotion dur="2.4s" repeatCount="indefinite" path="M780 386 L900 386"/></circle>
<text x="840" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#565A7A" text-anchor="middle">prompt</text>
<path id="e6" d="M630 330 C 700 300, 960 300, 1060 280" fill="none" stroke="#E8505B" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 8" style="animation:flow 1.6s linear infinite"/>
<circle r="5" fill="#E8505B"><animateMotion dur="5s" repeatCount="indefinite" path="M630 330 C 700 300, 960 300, 1060 280"/></circle>
<text x="850" y="296" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#565A7A" text-anchor="middle">owner log (optional)</text>
