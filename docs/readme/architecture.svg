<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img">
<defs></defs>
<style>@keyframes flow{to{stroke-dashoffset:-32}}@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.n1{animation:pop .7s ease-out .1s both}.n2{animation:pop .7s ease-out .3s both}.n3{animation:pop .7s ease-out .5s both}.n4{animation:pop .7s ease-out .7s both}.n5{animation:pop .7s ease-out .9s both}.n6{animation:pop .7s ease-out 1.1s both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1280" height="470" rx="22" fill="#FFF6E5" stroke="#E9D9B8" stroke-width="1.5"/>
<g class="n1"><rect x="36" y="168" width="300" height="140" rx="16" fill="#FFFCF3" stroke="#FF8A1F" stroke-width="2"/>
<rect x="36" y="168" width="300" height="8" rx="4" fill="#FF8A1F" opacity=".9"/>
<text x="54" y="202" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#1B1F3B">Visitor browser</text>
<text x="54" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">React 18 + Vite single-page app</text><text x="54" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">Lenis scroll, scroll-scrubbed scenes</text><text x="54" y="266" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">Web Audio, day and night themes</text><text x="54" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">AI Laksh chat (keeps its own history)</text></g>
<g class="n2"><rect x="480" y="30" width="300" height="100" rx="16" fill="#FFFCF3" stroke="#1FA6A0" stroke-width="2"/>
<rect x="480" y="30" width="300" height="8" rx="4" fill="#1FA6A0" opacity=".9"/>
<text x="498" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#1B1F3B">Vercel static site</text>
<text x="498" y="88" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">dist/ from vite build</text><text x="498" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">painted art as .webp in /art</text></g>
<g class="n3"><rect x="480" y="160" width="300" height="120" rx="16" fill="#FFFCF3" stroke="#8E7CFF" stroke-width="2"/>
<rect x="480" y="160" width="300" height="8" rx="4" fill="#8E7CFF" opacity=".9"/>
<text x="498" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#1B1F3B">Vercel serverless /api</text>
<text x="498" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">wall.js: guestbook notes</text><text x="498" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">visit.js: daily visitor counter</text><text x="498" y="258" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">rate limited, no links allowed</text></g>
<g class="n4"><rect x="900" y="160" width="340" height="120" rx="16" fill="#FFFCF3" stroke="#E8505B" stroke-width="2"/>
<rect x="900" y="160" width="340" height="8" rx="4" fill="#E8505B" opacity=".9"/>
<text x="918" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#1B1F3B">Upstash Redis</text>
<text x="918" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">wall notes, visit count</text><text x="918" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">optional: without it the wall</text><text x="918" y="258" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">shows a placeholder</text></g>
<g class="n5"><rect x="480" y="330" width="300" height="112" rx="16" fill="#FFFCF3" stroke="#FF8A1F" stroke-width="2"/>
<rect x="480" y="330" width="300" height="8" rx="4" fill="#FF8A1F" opacity=".9"/>
<text x="498" y="364" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#1B1F3B">AI Laksh backend</text>
<text x="498" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">Express on its own Vercel project</text><text x="498" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">guard, Gemini, cards, chips</text><text x="498" y="428" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">thumbs and owner log</text></g>
<g class="n6"><rect x="900" y="330" width="340" height="112" rx="16" fill="#FFFCF3" stroke="#FFC93C" stroke-width="2"/>
<rect x="900" y="330" width="340" height="8" rx="4" fill="#FFC93C" opacity=".9"/>
<text x="918" y="364" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#1B1F3B">Google Gemini</text>
<text x="918" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">flash-lite first, then 2.5 and 3.5</text><text x="918" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">JSON reply: text, cards, follow-ups</text><text x="918" y="428" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#565A7A">optional Groq fallback</text></g>
<path id="e1" d="M336 205 C 410 205, 420 80, 480 80" fill="none" stroke="#1FA6A0" stroke-opacity=".5" stroke-width="2" stroke-dasharray="8 8" style="animation:flow 1.6s linear infinite"/>
