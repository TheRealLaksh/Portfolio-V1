<circle cx="80" cy="88" r="17" fill="#FF8A1F"/><text x="80" y="94.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#1B1F3B" text-anchor="middle">1</text>
<text x="108" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#1B1F3B">Question</text>
