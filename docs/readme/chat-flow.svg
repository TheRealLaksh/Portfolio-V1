<text x="356" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#1B1F3B">Input guard</text>
<text x="314" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#565A7A">no prompt tricks</text><text x="314" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#565A7A">no homework or code</text></g><path d="M496 127 H536" stroke="#565A7A" stroke-opacity=".6" stroke-width="2.4" stroke-dasharray="6 6" style="animation:flow 1.4s linear infinite"/><path d="M528 119 L536 127 L528 135" stroke="#565A7A" stroke-opacity=".7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="s2"><rect x="542" y="52" width="196" height="150" rx="18" fill="#FFFCF3" stroke="#8E7CFF" stroke-width="2.4"/>
<circle cx="576" cy="88" r="17" fill="#8E7CFF"/><text x="576" y="94.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#1B1F3B" text-anchor="middle">3</text>
<text x="604" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#1B1F3B">Gemini</text>
<text x="562" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#565A7A">facts block only</text><text x="562" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#565A7A">answers as JSON</text></g><path d="M744 127 H784" stroke="#565A7A" stroke-opacity=".6" stroke-width="2.4" stroke-dasharray="6 6" style="animation:flow 1.4s linear infinite"/><path d="M776 119 L784 127 L776 135" stroke="#565A7A" stroke-opacity=".7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="s3"><rect x="790" y="52" width="196" height="150" rx="18" fill="#FFFCF3" stroke="#1FA6A0" stroke-width="2.4"/>
<circle cx="824" cy="88" r="17" fill="#1FA6A0"/><text x="824" y="94.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#1B1F3B" text-anchor="middle">4</text>
<text x="852" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#1B1F3B">Output check</text>
