<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img">
<defs></defs>
<style>@keyframes hl{0%,16%,100%{opacity:.35;transform:translateY(0)}6%,12%{opacity:1;transform:translateY(-5px)}}@keyframes flow{to{stroke-dashoffset:-32}}.s0{animation:hl 10s ease-in-out 0s infinite;transform-box:fill-box}.s1{animation:hl 10s ease-in-out 1.6s infinite;transform-box:fill-box}.s2{animation:hl 10s ease-in-out 3.2s infinite;transform-box:fill-box}.s3{animation:hl 10s ease-in-out 4.800000000000001s infinite;transform-box:fill-box}.s4{animation:hl 10s ease-in-out 6.4s infinite;transform-box:fill-box}
