<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="36" viewBox="0 0 1280 36" role="img">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset=".25" stop-color="#38bdf8"/><stop offset=".75" stop-color="#a855f7"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient></defs>
<style>@keyframes draw{from{stroke-dashoffset:1500}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-48}}
.d1{stroke-dasharray:1500;animation:draw 2.6s ease-out both}.d2{stroke-dasharray:6 10;animation:flow 2.2s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<path class="d1" d="M20 18 C 180 2, 300 34, 460 18 S 760 2, 900 18 S 1130 34, 1260 18" stroke="url(#g)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<path class="d2" d="M20 18 C 180 2, 300 34, 460 18 S 760 2, 900 18 S 1130 34, 1260 18" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.2" fill="none"/>
<circle r="5.5" fill="#38bdf8"><animateMotion dur="7s" repeatCount="indefinite" path="M20 18 C 180 2, 300 34, 460 18 S 760 2, 900 18 S 1130 34, 1260 18"/></circle>
<circle r="11" fill="#38bdf8" opacity=".25"><animateMotion dur="7s" repeatCount="indefinite" path="M20 18 C 180 2, 300 34, 460 18 S 760 2, 900 18 S 1130 34, 1260 18"/></circle>
</svg>
